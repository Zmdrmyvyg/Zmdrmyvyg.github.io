name: Bootstrap al-folio site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Populate personalized al-folio site
        env:
          OVERLAY: 
        run: |
          git clone --depth 1 https://github.com/alshedivat/al-folio.git /tmp/al-folio
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/al-folio/. .
          printf '%s' "$OVERLAY" | base64 -d > /tmp/overlay.tar.gz
          tar -xzf /tmp/overlay.tar.gz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build personal al-folio site"
          git push origin main
